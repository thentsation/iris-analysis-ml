version: 2

updates:
  - package-ecosystem: pip
    directory: /config
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - python
    ignore:
      # numpy 2.5+ requires Python >=3.12; CI still tests 3.11.
      - dependency-name: "numpy"
        versions: [">=2.5"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
